services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ulybka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulybka}
      POSTGRES_DB: ${POSTGRES_DB:-ulybka}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ulybka} -d ${POSTGRES_DB:-ulybka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ulybka}:${POSTGRES_PASSWORD:-ulybka}@postgres:5432/${POSTGRES_DB:-ulybka}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
    ports:
      - "${BOT_PORT:-3000}:3000"
    volumes:
      - ./data/whatsapp-auth:/data/whatsapp-auth
      - ./secrets:/secrets:ro

volumes:
  postgres_data:
